[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multihunter"
version = "0.1.0"
description = "Multi-agent security testing system built on Claude-BugHunter: recon -> map -> think -> exploit -> prove -> report."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MultiHunter" }]

[project.scripts]
mh = "orchestrator.cli:main"

[tool.setuptools]
packages = ["orchestrator"]

[tool.setuptools.package-data]
orchestrator = ["templates/*.md", "templates/*.json"]